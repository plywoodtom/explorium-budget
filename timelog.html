<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>Explorium Time Tracker</title>
<style>
  :root{--bg:#1a1a1a;--panel:#242424;--panel-2:#2e2e2e;--border:#3a3a3a;--text:#e8e8e8;
    --text-dim:#999;--text-dimmer:#777;--accent:#4ade80;--warn:#fb923c;--over:#f87171;--link:#60a5fa;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;padding-bottom:120px;}
  header{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);
    padding:10px 14px;display:flex;flex-direction:column;gap:6px;}
  header h1{margin:0;font-size:17px;font-weight:600;}
  .nav a{color:var(--link);font-size:13px;text-decoration:none;margin-right:12px;}
  main{padding:12px;}
  .summary{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;}
  .scell{display:flex;flex-direction:column;}
  .slab{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);}
  .sval{font-size:18px;font-weight:700;}
  .sval.good{color:var(--accent);}
  .bycat{margin-top:10px;font-size:12px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:4px 12px;}
  /* ---- clock-in/out timer ---- */
  .timer{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .timer.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .timer-top{display:flex;align-items:center;gap:12px;}
  .clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:130px;}
  .clock.idle{color:var(--text-dimmer);font-size:26px;min-width:0;}
  .timer-meta{flex:1;font-size:12px;color:var(--text-dim);min-width:0;}
  .timer-meta b{color:var(--text);font-weight:600;}
  .big{font-size:18px;font-weight:700;min-height:56px;flex:1;}
  .btn-start{background:var(--accent);color:#0a0a0a;border-color:var(--accent);}
  .btn-stop{background:var(--over);color:#0a0a0a;border-color:var(--over);}
  .timer-inputs{display:flex;gap:6px;margin-top:10px;}
  .timer-inputs input,.timer-inputs select{background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:9px 8px;font-size:14px;font-family:inherit;}
  .timer-inputs #t-desc{flex:1;min-width:0;}
  .timer-row2{display:flex;gap:8px;margin-top:10px;}
  .link-btn{background:transparent;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:4px;min-height:0;}
  /* ---- manual add ---- */
  .add-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .add-row input,.add-row select{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:9px 8px;font-size:14px;font-family:inherit;}
  #e-date{width:140px;} #e-cat{flex:0 0 auto;} #e-desc{flex:1;min-width:120px;} #e-hours{width:64px;text-align:center;}
  /* ---- entries (editable) ---- */
  .entries{display:flex;flex-direction:column;gap:7px;}
  .entry{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;
    display:flex;flex-direction:column;gap:7px;font-size:13px;}
  .erow{display:flex;gap:6px;align-items:center;}
  .entry input,.entry select{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:7px 6px;font-size:13px;font-family:inherit;}
  .e-date{width:128px;} .e-cat{flex:0 0 auto;} .e-hrs{width:66px;text-align:center;font-weight:700;color:var(--accent);}
  .e-desc{flex:1;min-width:0;}
  .e-task{flex:1;min-width:0;}
  .e-tasklab{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);flex:0 0 auto;}
  .e-del{background:transparent;border:1px solid var(--border);color:var(--over);border-radius:6px;padding:7px 10px;font-size:14px;cursor:pointer;flex:0 0 auto;}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;
    padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer;min-height:38px;}
  button.primary{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:600;}
  .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);
    padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:200;}
  .save-status{flex:1;font-size:12px;color:var(--text-dim);}
  .save-status.dirty{color:var(--warn);} .save-status.saving{color:var(--link);}
  .save-status.saved{color:var(--accent);} .save-status.error{color:var(--over);}
  .hint{font-size:11px;color:var(--text-dimmer);margin:8px 2px 0;}
</style>
</head>
<body>
<header>
  <h1>Explorium Time Tracker</h1>
  <div class="nav"><a href="index.html">Budget</a><a href="tasks.html">Tasks</a></div>
</header>

<main>
  <!-- Clock in / out -->
  <div class="timer" id="timer"></div>

  <div class="summary" id="summary"></div>

  <details>
    <summary style="font-size:12px;color:var(--text-dim);cursor:pointer;margin-bottom:8px;">+ Add a past entry manually</summary>
    <div class="add-row" style="margin-top:8px;">
      <input type="date" id="e-date">
      <select id="e-cat">
        <option>Cutting</option><option>Assembly</option><option>Skinning</option>
        <option>Wiring</option><option>Install</option><option>Design</option>
        <option>Sourcing</option><option>Travel/Pickup</option><option>Admin</option><option>Other</option>
      </select>
      <input type="text" id="e-desc" placeholder="What did you do?">
      <input type="number" id="e-hours" placeholder="hrs" min="0" step="0.25">
      <button onclick="addEntry()">Add</button>
    </div>
  </details>

  <div class="entries" id="entries"></div>
  <div class="hint">Tap Start to clock in; Stop creates an entry you can edit (time, category, description) and assign to a task. Times persist if your phone locks or the page reloads. Remember to hit Save to push to the cloud.</div>
</main>

<div class="save-bar">
  <span class="save-status" id="save-status">Loading...</span>
  <button class="primary" onclick="save()">Save</button>
</div>

<script>
const WORKER_URL = "https://explorium-budget-worker.plywoodtom.workers.dev";
const SECRET_STORAGE_KEY = "explorium_budget_secret";
const TIMER_KEY = "explorium_active_timer";
const CATS = ["Cutting","Assembly","Skinning","Wiring","Install","Design","Sourcing","Travel/Pickup","Admin","Other"];
let data = { sections:[], tasks:[], timelog:[] };
let dirty = false;
let tickHandle = null;

function uid(){ return "t-"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
function getSecret(){
  let s=localStorage.getItem(SECRET_STORAGE_KEY);
  if(!s){ s=prompt("Enter edit secret (same one used by the budget tracker):"); if(s) localStorage.setItem(SECRET_STORAGE_KEY,s); }
  return s;
}
function setStatus(m,c){ const e=document.getElementById("save-status"); e.textContent=m; e.className="save-status "+(c||""); }
function fmt(n){ return "$"+(Math.round(n)).toLocaleString("en-US"); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function markDirty(){ dirty=true; setStatus("Unsaved changes","dirty"); }

/* ---------- clock in / out ---------- */
function getTimer(){ try{ return JSON.parse(localStorage.getItem(TIMER_KEY)); }catch(e){ return null; } }
function setTimer(t){ if(t) localStorage.setItem(TIMER_KEY, JSON.stringify(t)); else localStorage.removeItem(TIMER_KEY); }

function startTimer(){
  const desc=document.getElementById("t-desc") ? document.getElementById("t-desc").value.trim() : "";
  const cat=document.getElementById("t-cat") ? document.getElementById("t-cat").value : "Other";
  setTimer({ startTs: Date.now(), desc, cat });
  renderTimer();
}
function stopTimer(){
  const t=getTimer(); if(!t) return;
  const ms=Date.now()-t.startTs;
  const hours=Math.max(0.01, Math.round(ms/3600000*100)/100);
  data.timelog.push({ id:uid(), date:new Date().toISOString().slice(0,10), cat:t.cat||"Other", desc:t.desc||"", hours, taskId:"" });
  setTimer(null);
  markDirty(); renderTimer(); render();
}
function discardTimer(){ if(confirm("Discard this running timer without logging it?")){ setTimer(null); renderTimer(); } }

function hms(ms){
  const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  const p=n=>String(n).padStart(2,"0");
  return p(h)+":"+p(m)+":"+p(ss);
}
function tick(){
  const t=getTimer(); const clock=document.getElementById("clock");
  if(t && clock){ clock.textContent=hms(Date.now()-t.startTs); }
}
function renderTimer(){
  const wrap=document.getElementById("timer"); const t=getTimer();
  if(t){
    wrap.className="timer running";
    wrap.innerHTML=`
      <div class="timer-top">
        <span class="clock" id="clock">00:00:00</span>
        <span class="timer-meta">Clocked in${t.cat?` - <b>${esc(t.cat)}</b>`:""}${t.desc?`<br>${esc(t.desc)}`:""}</span>
      </div>
      <div class="timer-row2">
        <button class="big btn-stop" onclick="stopTimer()">&#9632; Stop &amp; log</button>
      </div>
      <button class="link-btn" onclick="discardTimer()">discard without logging</button>`;
    tick();
  } else {
    wrap.className="timer";
    wrap.innerHTML=`
      <div class="timer-top">
        <span class="clock idle">--:--:--</span>
        <span class="timer-meta">Not clocked in. Tap Start when you begin a task.</span>
      </div>
      <div class="timer-inputs">
        <select id="t-cat">${CATS.map(c=>`<option${c==='Other'?' selected':''}>${c}</option>`).join("")}</select>
        <input type="text" id="t-desc" placeholder="What are you working on? (optional)">
      </div>
      <div class="timer-row2">
        <button class="big btn-start" onclick="startTimer()">&#9658; Start</button>
      </div>`;
  }
}

/* ---------- summary ---------- */
function totalSpent(){
  let sum=0;
  (data.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{
    if(Array.isArray(it.payments)&&it.payments.length) sum+=it.payments.reduce((a,p)=>a+(Number(p.amount)||0),0);
    else sum+=Number(it.actualCost)||0;
  }));
  return sum;
}
function renderSummary(){
  const hrs=data.timelog.reduce((s,e)=>s+(Number(e.hours)||0),0);
  const contract=Number(data.contractTotal)||0;
  const spent=totalSpent();
  const profit=contract-spent;
  const revPerHr=hrs?contract/hrs:0;
  const profPerHr=hrs?profit/hrs:0;
  const byCat={};
  data.timelog.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+(Number(e.hours)||0); });
  const cats=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a])
    .map(c=>`${c} ${(byCat[c]).toFixed(2)}h`).join("  -  ");
  document.getElementById("summary").innerHTML=`
    <div class="sgrid">
      <div class="scell"><span class="slab">Total hours</span><span class="sval">${hrs.toFixed(2)}</span></div>
      <div class="scell"><span class="slab">Profit so far</span><span class="sval ${profit>=0?'good':''}">${fmt(profit)}</span></div>
      <div class="scell"><span class="slab">Revenue / hour</span><span class="sval">${hrs?fmt(revPerHr):'-'}</span></div>
      <div class="scell"><span class="slab">Profit / hour</span><span class="sval ${profPerHr>=0?'good':''}">${hrs?fmt(profPerHr):'-'}</span></div>
    </div>
    <div class="bycat">${cats||"No time logged yet"}</div>
    <div class="bycat">Contract ${fmt(contract)} - Spent ${fmt(spent)}</div>`;
}

/* ---------- editable entries ---------- */
function taskOptions(sel){
  let o=`<option value="">(no task)</option>`;
  (data.tasks||[]).forEach(t=>{ o+=`<option value="${t.id}"${t.id===sel?" selected":""}>${esc(t.text)}</option>`; });
  return o;
}
function catOptions(sel){
  return CATS.map(c=>`<option${c===sel?" selected":""}>${c}</option>`).join("");
}
function render(){
  const wrap=document.getElementById("entries"); wrap.innerHTML="";
  const sorted=[...data.timelog].map((e,idx)=>({e,idx})).sort((a,b)=>(b.e.date||"").localeCompare(a.e.date||""));
  sorted.forEach(({e,idx})=>{
    const row=document.createElement("div"); row.className="entry";
    row.innerHTML=`
      <div class="erow">
        <input type="date" class="e-date" value="${e.date||""}" onchange="updEntry(${idx},'date',this.value)">
        <select class="e-cat" onchange="updEntry(${idx},'cat',this.value)">${catOptions(e.cat)}</select>
        <input type="number" class="e-hrs" value="${Number(e.hours)||0}" min="0" step="0.25" onchange="updEntry(${idx},'hours',this.value)">
        <button class="e-del" onclick="delEntry(${idx})">&times;</button>
      </div>
      <div class="erow">
        <input type="text" class="e-desc" placeholder="What did you do?" value="${esc(e.desc)}" onchange="updEntry(${idx},'desc',this.value)">
      </div>
      <div class="erow">
        <span class="e-tasklab">Task</span>
        <select class="e-task" onchange="updEntry(${idx},'taskId',this.value)">${taskOptions(e.taskId||"")}</select>
      </div>`;
    wrap.appendChild(row);
  });
  renderSummary();
}
function updEntry(i,field,val){
  if(field==="hours") val=Number(val)||0;
  data.timelog[i][field]=val;
  markDirty();
  if(field==="hours"||field==="cat") renderSummary();
}

function addEntry(){
  const date=document.getElementById("e-date").value;
  const cat=document.getElementById("e-cat").value;
  const desc=document.getElementById("e-desc").value.trim();
  const hours=Number(document.getElementById("e-hours").value)||0;
  if(!hours){ alert("Enter hours"); return; }
  data.timelog.push({id:uid(),date:date||new Date().toISOString().slice(0,10),cat,desc,hours,taskId:""});
  document.getElementById("e-desc").value=""; document.getElementById("e-hours").value="";
  markDirty(); render();
}
function delEntry(i){ if(confirm("Delete this entry?")){ data.timelog.splice(i,1); markDirty(); render(); } }

async function save(){
  const secret=getSecret(); if(!secret){ setStatus("Secret required","error"); return; }
  data.lastModified=new Date().toISOString();
  setStatus("Saving...","saving");
  try{
    const res=await fetch(WORKER_URL,{method:"POST",
      headers:{"Content-Type":"application/json","X-Edit-Secret":secret},body:JSON.stringify(data)});
    if(!res.ok) throw new Error("HTTP "+res.status+": "+await res.text());
    dirty=false; setStatus("Saved","saved");
  }catch(e){ setStatus("Save failed: "+e.message,"error"); console.error(e); }
}

async function load(){
  try{
    const res=await fetch("data.json?t="+Date.now());
    if(res.ok) data=await res.json();
    if(!Array.isArray(data.sections)) data.sections=[];
    if(!Array.isArray(data.tasks)) data.tasks=[];
    if(!Array.isArray(data.timelog)) data.timelog=[];
    document.getElementById("e-date").value=new Date().toISOString().slice(0,10);
    setStatus("Loaded "+(data.lastModified?new Date(data.lastModified).toLocaleString():""),"saved");
    renderTimer(); render();
  }catch(e){ setStatus("Load error: "+e.message,"error"); data={sections:[],tasks:[],timelog:[]}; renderTimer(); render(); }
}

window.addEventListener("DOMContentLoaded", ()=>{ load(); tickHandle=setInterval(tick,1000); });
window.addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
</script>
</body>
</html>
