<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>Explorium Budget Tracker</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --panel-2: #2e2e2e;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --text-dim: #999;
    --text-dimmer: #777;
    --accent: #4ade80;
    --warn: #fb923c;
    --over: #f87171;
    --under: #4ade80;
    --link: #60a5fa;

    --cat-electronics: #3b82f6;
    --cat-materials: #b45309;
    --cat-consumables: #eab308;
    --cat-labor: #22c55e;
    --cat-tools: #f97316;
    --cat-overhead: #64748b;
    --cat-misc: #71717a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.4;
    padding-bottom: 100px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
  }
  .grand-totals {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 14px;
    font-size: 12px;
  }
  .gt-cell { display: flex; flex-direction: column; }
  .gt-label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .gt-value { font-size: 15px; font-weight: 600; }
  .gt-value.over { color: var(--over); }
  .gt-value.under { color: var(--under); }
  .search-bar {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .search-bar input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--text-dimmer); }
  .search-clear {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    min-height: 0;
  }
  main { padding: 12px 12px 80px; }
  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    position: relative;
  }
  .section.dim { opacity: 0.35; }
  .section-stripe {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: var(--cat-misc);
  }
  .section[data-category="electronics"] .section-stripe { background: var(--cat-electronics); }
  .section[data-category="materials"] .section-stripe { background: var(--cat-materials); }
  .section[data-category="consumables"] .section-stripe { background: var(--cat-consumables); }
  .section[data-category="labor"] .section-stripe { background: var(--cat-labor); }
  .section[data-category="tools"] .section-stripe { background: var(--cat-tools); }
  .section[data-category="overhead"] .section-stripe { background: var(--cat-overhead); }
  .section[data-category="misc"] .section-stripe { background: var(--cat-misc); }

  .section-header {
    padding: 12px 14px 12px 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: start;
  }
  .section-header.collapsed { border-bottom-color: transparent; }
  .section-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .section-chevron {
    color: var(--text-dim);
    font-size: 11px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
    display: inline-block;
    transform: rotate(0deg);
  }
  .section-header:not(.collapsed) .section-chevron { transform: rotate(90deg); }
  .section-name {
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .section-summary {
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .ss-cell { display: inline-flex; gap: 4px; align-items: baseline; }
  .ss-label { color: var(--text-dimmer); }
  .ss-value { color: var(--text); font-weight: 500; }
  .ss-value.over { color: var(--over); }
  .ss-value.under { color: var(--under); }
  .ss-target { color: var(--link); text-decoration: underline dotted; cursor: pointer; }
  .section-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .section-body { padding: 8px 8px 8px 13px; }
  .section-notes {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
    resize: vertical;
    min-height: 36px;
    font-family: inherit;
  }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .item.match-highlight { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .item.duplicate { border-color: var(--warn); }
  .item-row1 {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .item-desc {
    flex: 1;
    font-weight: 500;
    font-size: 14px;
  }
  .item-desc .dup-flag {
    color: var(--warn);
    font-size: 10px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .item-meta {
    font-size: 11px;
    color: var(--text-dim);
  }
  .item-row2 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    font-size: 12px;
  }
  .cell { display: flex; flex-direction: column; }
  .cell-label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .cell-value { font-size: 14px; font-weight: 500; }
  .cell-value.over { color: var(--over); }
  .cell-value.under { color: var(--under); }
  .item-notes {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 2px;
  }
  .item-receipt {
    font-size: 11px;
    color: var(--link);
    margin-top: 2px;
  }
  .item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    min-height: 36px;
  }
  button:active { background: var(--border); }
  button.primary {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.danger { color: var(--over); }
  button.small { padding: 4px 10px; min-height: 28px; font-size: 12px; }
  .add-item-btn { margin-top: 8px; width: 100%; }
  .add-section-btn { margin: 16px 0; width: 100%; padding: 14px; font-size: 14px; }
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 200;
  }
  .save-status {
    flex: 1;
    font-size: 12px;
    color: var(--text-dim);
  }
  .save-status.dirty { color: var(--warn); }
  .save-status.saving { color: var(--link); }
  .save-status.saved { color: var(--accent); }
  .save-status.error { color: var(--over); }
  input[type="text"], input[type="number"], textarea {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  input[type="number"] { -moz-appearance: textfield; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal-form { display: flex; flex-direction: column; gap: 10px; }
  .modal-form label { font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; }
  .modal-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
  .modal-form select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  .color-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: -1px;
  }
  .deposit-band {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin: 0 0 2px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    align-items: baseline;
    font-size: 12px;
  }
  .deposit-label { color: var(--text-dim); }
  .deposit-value { color: var(--accent); font-weight: 600; font-size: 14px; }
  .deposit-meta { color: var(--text-dimmer); font-size: 11px; }
  .addon-badge {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--warn);
    color: #0a0a0a;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 6px;
    font-weight: 700;
    vertical-align: 1px;
  }
</style>
</head>
<body>

<header>
  <h1>Explorium Budget Tracker</h1>
  <div class="deposit-band" id="deposit-band" style="display:none">
    <span class="deposit-label">Deposit:</span>
    <span class="deposit-value" id="deposit-value">$0</span>
    <span class="deposit-meta" id="deposit-meta"></span>
  </div>
  <div class="grand-totals">
    <div class="gt-cell">
      <span class="gt-label">Original Spent</span>
      <span class="gt-value" id="grand-orig-spent">$0</span>
    </div>
    <div class="gt-cell">
      <span class="gt-label">Deposit Remaining</span>
      <span class="gt-value" id="grand-deposit-remaining">$0</span>
    </div>
    <div class="gt-cell">
      <span class="gt-label">Add-ons Spent</span>
      <span class="gt-value" id="grand-addons-spent">$0</span>
    </div>
    <div class="gt-cell">
      <span class="gt-label">Total Out of Pocket</span>
      <span class="gt-value" id="grand-total-spent">$0</span>
    </div>
  </div>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Search items..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none">Clear</button>
  </div>
  <div class="color-legend">
    <span><span class="legend-dot" style="background:var(--cat-electronics)"></span>Electronics</span>
    <span><span class="legend-dot" style="background:var(--cat-materials)"></span>Materials</span>
    <span><span class="legend-dot" style="background:var(--cat-consumables)"></span>Consumables</span>
    <span><span class="legend-dot" style="background:var(--cat-labor)"></span>Labor</span>
    <span><span class="legend-dot" style="background:var(--cat-tools)"></span>Tools</span>
    <span><span class="legend-dot" style="background:var(--cat-overhead)"></span>Overhead</span>
    <span><span class="legend-dot" style="background:var(--cat-misc)"></span>Misc</span>
  </div>
</header>

<main id="app">
  <div id="sections"></div>
  <button class="add-section-btn" onclick="addSection()">+ Add Section</button>
</main>

<div class="save-bar">
  <span class="save-status" id="save-status">Loaded</span>
  <button onclick="expandAll()" class="small">Expand all</button>
  <button onclick="collapseAll()" class="small">Collapse all</button>
  <button class="primary" onclick="save()">Save</button>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
